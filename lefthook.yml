pre-commit:
  parallel: true
  commands:
    biome:
      glob: "*.{js,mjs,ts,astro,css,json,jsonc}"
      run: pnpm exec biome check --write --no-errors-on-unmatched --files-ignore-unknown=true {staged_files}
      stage_fixed: true
    types:
      glob: "*.{ts,astro}"
      run: pnpm check

commit-msg:
  commands:
    commitlint:
      run: pnpm exec commitlint --edit {1}
